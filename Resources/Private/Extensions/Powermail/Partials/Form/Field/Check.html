{namespace vh=In2code\Powermail\ViewHelpers}

<div class="form__item form__item--checkbox form__item-{field.marker} form__item--width-{field.columnWidth} powermail_fieldwrap powermail_fieldwrap_type_check powermail_fieldwrap_{field.marker} {field.css} {settings.styles.framework.fieldAndLabelWrappingClasses}">
	<f:render partial="Form/FieldLabel" section="Standalone" arguments="{_all}" />

	<div class="form__checkbox-container {settings.styles.framework.fieldWrappingClasses}">
		<f:for each="{field.modifiedSettings}" as="setting" iteration="index">
			<div class="form__checkbox {settings.styles.framework.checkClasses} {vh:validation.errorClass(field:field, class:'powermail_field_error')}">
				<f:form.checkbox
					property="{field.marker}"
					multiple="true"
					value="{setting.value}"
					checked="{vh:misc.prefillMultiField(field:field, mail:mail, cycle:index.cycle)}"
					id="form__checkbox--{field.marker}-{index.cycle}"
					additionalAttributes="{vh:validation.validationDataAttribute(field:field, iteration:index)}"
					class="form__checkbox-field powermail_checkbox powermail_checkbox_{field.uid}" />

				<label class="form__checkbox-label" for="form__checkbox--{field.marker}-{index.cycle}">
					<vh:string.escapeLabels>{setting.label}</vh:string.escapeLabels>
				</label>
			</div>
		</f:for>

		<f:if condition="{settings.validation.client}">
			<div class="powermail_field_error_container powermail_field_error_container_{field.marker}"></div>
		</f:if>
	</div>
</div>
