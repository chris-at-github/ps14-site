{namespace vh=In2code\Powermail\ViewHelpers}

<div class="form__item form__item--textarea form__item-{field.marker} form__item--width-{field.columnWidth} powermail_fieldwrap powermail_fieldwrap_type_textarea powermail_fieldwrap_{field.marker} {field.css} {settings.styles.framework.fieldAndLabelWrappingClasses}">
	<f:render partial="Form/FieldLabel" section="Default" arguments="{_all}" />
	<f:form.textarea
			cols="20"
			rows="5"
			id="form__field--{field.marker}"
			property="{field.marker}"
			placeholder="{field.placeholder}"
			value="{vh:misc.prefillField(field:field, mail:mail)}"
			additionalAttributes="{vh:validation.validationDataAttribute(field:field)}"
			class="form__field form__field--textarea powermail_textarea {settings.styles.framework.fieldClasses} {vh:validation.errorClass(field:field, class:'powermail_field_error')}" />
</div>
